services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: paircode
      POSTGRES_USER: paircode
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paircode -d paircode"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: always
  api:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/paircode
      DATABASE_USER: paircode
      DATABASE_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: https://${DOMAIN}
      RUNNER_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/paircode-run:/tmp/paircode-run
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}/api/v1
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN}/ws
    restart: always
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "127.0.0.1:7777:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on: [api, web]

volumes:
  postgres-data: