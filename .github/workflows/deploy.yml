name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend,frontend,docker-compose.prod.yml,Caddyfile"
          target: "~/PairCode"

      
      - name: Build and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RUNNER_WORK_DIR: ${{ vars.RUNNER_WORK_DIR || '/tmp/paircode-run' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOMAIN,JWT_SECRET,DB_PASSWORD,RUNNER_WORK_DIR
          script: |
            set -e
            cd ~/PairCode
            mkdir -p "$RUNNER_WORK_DIR"

            printf 'DOMAIN=%s\nJWT_SECRET=%s\nDB_PASSWORD=%s\nRUNNER_WORK_DIR=%s\n' \
              "$DOMAIN" "$JWT_SECRET" "$DB_PASSWORD" "$RUNNER_WORK_DIR" > .env

            chmod 600 .env

            docker build -t paircode-runner-python backend/runner-images/python
            docker build -t paircode-runner-java backend/runner-images/java
            docker build -t paircode-runner-cpp backend/runner-images/cpp

            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
