services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paircode
      POSTGRES_USER: paircode
      POSTGRES_PASSWORD: paircode
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paircode -d paircode"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/paircode
      DATABASE_USER: paircode
      DATABASE_PASSWORD: paircode
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-for-production}
      FRONTEND_ORIGIN: http://localhost:3000
      RUNNER_ENABLED: "true"
    ports: ["8080:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
