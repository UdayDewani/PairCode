services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: paircode
      POSTGRES_USER: paircode
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paircode -d paircode"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: always
  api:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/paircode
      DATABASE_USER: paircode
      DATABASE_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: https://${DOMAIN}
      RUNNER_ENABLED: "true"
      RUNNER_WORK_DIR: ${RUNNER_WORK_DIR:-/tmp/paircode-run}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_WORK_DIR:-/tmp/paircode-run}:${RUNNER_WORK_DIR:-/tmp/paircode-run}
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
    ports:
      - "3000:3000"
    restart: always
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on: [api, web]
volumes:
  postgres-data:
  caddy-data: