name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend,frontend,docker-compose.prod.yml,Caddyfile"
          target: "~/PairCode"

      - name: Build and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/PairCode
            mkdir -p /tmp/paircode-run
            cat > .env <<EOF
            DOMAIN=${{ secrets.DOMAIN }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF
            docker build -t paircode-runner-python backend/runner-images/python
            docker build -t paircode-runner-java backend/runner-images/java
            docker build -t paircode-runner-cpp backend/runner-images/cpp
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f